# O espelho do ./verificar. Roda a cada push e em cada pull request as mesmas duas
# verificacoes que se roda na maquina antes de commitar.
#
# O firmware do no nao entra aqui: ele e exercicio do aluno (firmware/ROTEIRO.md),
# escrito fora deste repositorio. Quem o confere e a propria plataforma, quando a
# leitura chega -- ou nao chega.

name: CI

on:
  push:
  pull_request:

jobs:
  plataforma:
    name: ruff e pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "platform[dev]"
      - run: ruff check platform contracts simulator
      - run: pytest platform/tests
