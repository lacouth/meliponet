# O CI existe sobretudo por um motivo: garantir que o firmware C++ e a plataforma
# Python continuem falando o mesmo contrato. Os tres jobs abaixo verificam isso de
# angulos diferentes, e qualquer um deles falhando significa que os dois lados
# divergiram.

name: CI

on:
  push:
  pull_request:

jobs:
  plataforma:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "platform[dev]"
      - run: ruff check platform contracts simulator
      - run: pytest platform/tests

  firmware:
    name: pio test -e native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      # Roda no PC, sem hardware. Cobre o codec, a escala, a montagem da mensagem, a
      # calibracao, o agendamento e o spool -- toda a logica do firmware que nao depende
      # de sensor. Os testes de codec e de escala comparam com os mesmos vetores que o
      # job `plataforma` consome pelo lado Python.
      - run: pio test -e native -d firmware

      # Compila para o alvo. Nao prova que funciona em campo, mas pega erro de
      # compilacao especifico do ESP32 que o ambiente `native` nao veria -- e o CI e o
      # unico lugar onde isso e checado a cada commit.
      - run: pio run -e esp32c6 -d firmware
