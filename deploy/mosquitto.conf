# Broker do MelipoNet.
#
# Persistencia ligada e sessoes duraveis sao o que cobre a janela em que o ingestor
# esta reiniciando: as mensagens QoS 1 publicadas nesse intervalo ficam na fila do
# broker em vez de se perderem. Sem isso, todo deploy da plataforma abriria uma lacuna
# nas series -- e lacuna e exatamente o que o Edital 17 se propoe a medir e minimizar.

listener 1883
persistence true
persistence_location /mosquitto/data/

# Nenhum acesso anonimo: cada no de campo e o ingestor tem credencial propria, criada
# com `mosquitto_passwd -c deploy/mosquitto.passwd <usuario>`.
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Uma mensagem valida do no completo fica em ~350 bytes; o teto generoso abaixo
# rejeita lixo sem estreitar o contrato.
message_size_limit 8192

log_dest stdout
log_type error
log_type warning
log_type notice
