; MelipoSense -- firmware do no sensor.
;
; Dois ambientes:
;
;   esp32c6  hardware real. Prototipo (Fase 3): 2x SHT30 + HX711 + WiFi/MQTT.
;   native   roda no PC, sem hardware. Exercita a logica pura -- codec, calibracao,
;            spool -- e e o ambiente do teste que compara o codec C++ com os vetores
;            dourados gerados pelo lado Python. E o que pode rodar no CI.
;
; A regra de projeto por tras dessa divisao: nada que possa ser testado sem hardware
; deve depender do Arduino. Ela esta materializada na estrutura de pastas --
; `lib/MelipoCore/` e puro e compila nos dois ambientes; `lib/MelipoHardware/` fala com
; Wire, WiFi, NVS e LittleFS e so compila para o ESP32.

[platformio]
default_envs = esp32c6

[env]
build_flags = -Wall -Wextra
test_framework = unity

[env:esp32c6]
; O platform oficial `espressif32` do PlatformIO parou no Arduino core 2.x, e o
; ESP32-C6 so ganhou suporte no core 3.x -- com ele, o build falha com "This board
; doesn't support arduino framework!". O fork pioarduino e o caminho usado pela
; comunidade para os chips novos (C6, H2, P4) e traz o core 3.x.
;
; A versao e fixada de proposito: um `platform = ...zip` apontando para "latest"
; mudaria o compilador e o core por baixo do projeto sem ninguem pedir, e um firmware
; que compilava passaria a nao compilar entre um commit e outro.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; A tabela padrao reserva so 1,3 MB para a aplicacao, e o firmware do prototipo ja
; ocupa 87% disso -- antes de entrar bioacustica, FFT e LoRa na Fase 5. A placa tem
; 8 MB; esta tabela usa a flash inteira e reserva uma particao de arquivos para o
; spool, que precisa dela para sobreviver a quedas de energia.
board_build.partitions = default_8MB.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    robtillaart/SHT31@^0.5.0
    bogde/HX711@^0.7.5
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DMELIPO_SAMPLE_INTERVAL_S=300
; O teste nativo nao roda no alvo: `pio test -e esp32c6` so faria sentido para testes
; que exigem hardware, que ainda nao existem.
test_ignore = *

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++20
    -I ../contracts/testdata
; O PlatformIO compila *todos* os arquivos de uma pasta de biblioteca, entao a divisao
; puro/hardware precisa ser por pasta e nao por arquivo -- foi assim que esta linha
; passou a funcionar. MelipoHardware fica de fora no PC; MelipoCore compila nos dois.
lib_ignore = MelipoHardware
