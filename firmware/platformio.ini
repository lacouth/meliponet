; MelipoSense -- firmware do no sensor.
;
; Dois ambientes:
;
;   esp32c6  hardware real. Prototipo (Fase 3): 2x SHT30 + HX711 + WiFi/MQTT.
;   native   roda no PC, sem hardware. Exercita a logica pura -- codec, calibracao,
;            spool -- e e o ambiente do teste que compara o codec C++ com os vetores
;            dourados gerados pelo lado Python. E o que pode rodar no CI.
;
; A regra de projeto por tras dessa divisao: nada que possa ser testado sem hardware
; deve depender do Arduino. Por isso `lib/MelipoNet/TelemetryCodec` nao inclui
; Arduino.h e compila nos dois ambientes.

[platformio]
default_envs = esp32c6

[env]
build_flags = -Wall -Wextra
test_framework = unity

[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    robtillaart/SHT31@^0.5.0
    bogde/HX711@^0.7.5
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DMELIPO_SAMPLE_INTERVAL_S=300
; O teste nativo nao roda no alvo: `pio test -e esp32c6` so faria sentido para testes
; que exigem hardware, que ainda nao existem.
test_ignore = *

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++20
    -I ../contracts/testdata
; No PC so compilamos as bibliotecas independentes do Arduino.
lib_ignore = MelipoSensors
