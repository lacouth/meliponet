# Configuracao unica de lint do monorepo.
#
# Fica na raiz, e nao em platform/pyproject.toml, porque contracts/ e simulator/ estao
# fora do pacote da plataforma e usariam a configuracao padrao do ruff -- divergindo
# silenciosamente das regras do resto do repositorio.

line-length = 100
target-version = "py311"

# Arquivos gerados pelo Alembic. Uma migracao ja aplicada em producao nao deve ser
# reescrita por um formatador: ela e o registro do que foi de fato executado no banco.
exclude = ["platform/migrations/versions"]

[lint]
select = ["E", "E402", "F", "I", "UP", "B", "RUF"]

[lint.per-file-ignores]
# Este modulo precisa ajustar sys.path antes de importar do monorepo, o que obriga o
# import a vir depois de codigo executavel.
"simulator/__main__.py" = ["E402"]
# O env.py do Alembic precisa ajustar sys.path antes de importar o modelo.
"platform/migrations/env.py" = ["E402"]
