[project]
name = "meliponet"
version = "0.1.0"
description = "Plataforma web de monitoramento de colmeias de abelhas nativas sem ferrao"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "flask-login>=0.6",
    "paho-mqtt>=2.1",
    "jsonschema>=4.20",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
meliponet-ingest = "meliponet.ingest.__main__:main"

# Sem esta secao o setuptools tenta adivinhar o que empacotar, encontra `meliponet/` e
# `migrations/` lado a lado e se recusa a continuar ("Multiple top-level packages
# discovered in a flat-layout"). Nao e ambiguidade de verdade: `migrations/` sao scripts
# do Alembic, rodados a partir do repositorio, e nunca deveriam ser instalados junto com
# a aplicacao.
#
# O defeito ficou escondido por meses porque um ambiente virtual criado antes de
# `migrations/` existir continua funcionando -- so uma instalacao limpa falha. Era por
# isso que o CI quebrava e a maquina de todo mundo passava.
[tool.setuptools.packages.find]
include = ["meliponet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

