[project]
name = "meliponet"
version = "0.1.0"
description = "Plataforma web de monitoramento de colmeias de abelhas nativas sem ferrao"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "flask-login>=0.6",
    "paho-mqtt>=2.1",
    "jsonschema>=4.20",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
meliponet-ingest = "meliponet.ingest.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

