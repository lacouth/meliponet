{% extends "base.html" %}
{% block title %}Entrar — MelipoNet{% endblock %}
{% block content %}

<div style="max-width: 380px; margin: 8vh auto 0;">
  <h1>Entrar</h1>
  <p class="sub">Monitoramento de colmeias de abelhas nativas sem ferrão.</p>

  <form method="post" class="card">
    <label class="field">
      <span>E-mail</span>
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
    </label>
    <label class="field">
      <span>Senha</span>
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
</div>

{% endblock %}
